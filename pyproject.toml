[project]
name = "braintumor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "albumentations>=2.0.8",
    "fastapi>=0.141.1",
    "matplotlib>=3.10.9",
    "mlflow>=3.15.2",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.7.2",
    "tifffile>=2025.5.10",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm>=4.66.5",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu128"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_seg"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
